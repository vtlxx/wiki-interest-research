[project]
name = "wiki-interest-research"
version = "0.1.0"
description = "Agent skill: research public interest in topics across Wikipedia language editions"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "fpdf2>=2.8",
]

[dependency-groups]
dev = ["pytest>=8.2", "pypdf>=5.0"]

[tool.uv]
package = false
exclude-newer = "2026-09-26T00:00:00Z"

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
markers = ["live: calls real Wikimedia APIs (run with: uv run pytest -m live)"]
addopts = "-m 'not live'"
