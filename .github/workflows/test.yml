name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      # `validate .` fails: the validator takes the skill name from the folder name it is given
      - run: uvx --from skills-ref agentskills validate "$GITHUB_WORKSPACE"
